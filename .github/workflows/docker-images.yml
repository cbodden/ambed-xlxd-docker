## builds the AMBEd && XLXd images for amd64 + arm64 on native runners
## and pushes multi-arch tags to docker hub && ghcr
##   testing branch -> :test
##   main branch    -> :latest
##   vX.Y.Z tag     -> :X.Y.Z
name: docker images

on:
  push:
    branches: [main, testing]
    tags: ['v*']
    paths:
      - 'AMBEd/**'
      - 'XLXd/**'
      - '.github/workflows/docker-images.yml'
  schedule:
    - cron: '0 6 * * 1'   # weekly rebuild of main for base image updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build ${{ matrix.image.name }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: ambed-docker, context: AMBEd }
          - { name: xlxd-docker,  context: XLXd }
        platform:
          - { arch: amd64, os: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, os: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: login docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build && push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.platform.os }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          outputs: type=image,"name=docker.io/cbodden/${{ matrix.image.name }},ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}",push-by-digest=true,name-canonical=true,push=true

      - name: export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [ambed-docker, xlxd-docker]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: login docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/cbodden/${{ matrix.image }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/testing' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: create multi-arch manifests
        working-directory: ${{ runner.temp }}/digests
        run: |
          for repo in docker.io/cbodden/${{ matrix.image }} ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}; do
            tags=$(jq -cr --arg r "${repo}:" '.tags | map(select(startswith($r))) | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
            if [ -z "${tags}" ]; then
              echo "no tags for ${GITHUB_REF} - skipping ${repo}"
              continue
            fi
            docker buildx imagetools create ${tags} $(printf "${repo}@sha256:%s " *)
            for t in $(jq -r --arg r "${repo}:" '.tags[] | select(startswith($r))' <<< "${DOCKER_METADATA_OUTPUT_JSON}"); do
              docker buildx imagetools inspect "${t}"
            done
          done
