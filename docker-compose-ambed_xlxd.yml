## AMBEd + XLXd example (+ optional NXDN / P25 / YSF reflectors peered into XLXd)
##
## AMBEd needs the FTDI sticks free of the kernel serial drivers, on the host :
##   /etc/udev/rules.d/99-ambed.rules
##   ACTION=="add", ATTRS{idVendor}=="0403", ATTRS{idProduct}=="6015", MODE="0666", RUN+="/bin/sh -c 'rmmod ftdi_sio && rmmod usbserial'"
##
## the NXDN, P25 and YSF reflectors are switched on / off with one variable each (in .env / Portainer's
## stack env, or the shell) - it starts the reflector AND adds its peer line to xlxd.interlink :
##   NXDN_REFLECTOR=1   P25_REFLECTOR=1   YSF_REFLECTOR=1      (0 or unset = off)
## each reflector's dashboard follows it; NXDN_DASHBOARD=0 / P25_DASHBOARD=0 / YSF_DASHBOARD=0 turns just the dashboard off
## (YSF_DASHBOARD_CLASSIC=1 adds pYSF3's own dashboard - DG-ID / blocked views - on 8084)
##
## images are also on ghcr.io/cbodden/{ambed,xlxd,nxdnreflector,p25reflector,nxdndashboard,p25dashboard,ysfreflector,ysfdashboard2,ysfdashboard}-docker

services:
  ambed:
    container_name: ambed
    hostname: ambed
    image: cbodden/ambed-docker:latest
    restart: unless-stopped
    privileged: true          # or pass the usb bus through instead :
    # devices:
    #   - "/dev/bus/usb/001/:/dev/bus/usb/001/"
    # device_cgroup_rules:
    #   - 'c 188:* rwm'
    # environment:            # optional ambed.ini settings, see README "AMBEd settings"
    #   AMBED_USE_AGC: "1"
    #   AMBED_PCM_TO_DMR: "0"
    ports:
      - 10100:10100/udp       # ambe controller
      - 10101-10199:10101-10199/udp # ambe transcoding streams

  xlxd:
    container_name: xlxd
    hostname: xlxd
    image: cbodden/xlxd-docker:latest
    restart: unless-stopped
    depends_on:
      - ambed
    environment:
      XLXNUM: XLX000          # required
      URL: xlx.example.com    # required - dashboard host name
      PORT: "80"
      AMBED: ambed            # ambed service / container name - must resolve from xlxd
      CALLSIGN: XYZ123
      EMAIL: me@example.com
      COUNTRY: United States
      DESCRIPTION: XLX000 by XYZ123
      COMMENT: Hosted by XYZ123
      CALLHOME: "false"       # true registers the reflector with the xlx network
      TZ: UTC
      MODULES: "6"            # modules shown on the dashboard
      MODULEA: Int.           # module names, MODULEA..MODULEZ - <br> for a line break
      MODULEB: Regional
      MODULEC: National
      MODULED: Local<br>Ragchew
      MODULEE: NXDN<br>31000
      MODULEF: P25<br>31000
      ## dashboard pages / lists - defaults shown
      REFLECTORS_PAGE: "on"
      IRCDDB_PAGE: "off"
      TRAFFIC_PAGE: "off"     # on also needs the vnstat volume below to keep history
      LASTHEARD_LIMIT: "39"
      PAGE_REFRESH: "10"
      IP_DISPLAY: "hide"
      ## peers for the optional reflectors below : "<number> <host>:<port> <module>"
      NXDN_PEER_ENABLED: "${NXDN_REFLECTOR:-0}"
      NXDN_PEER: "31000 nxdnreflector:41400 E"
      P25_PEER_ENABLED: "${P25_REFLECTOR:-0}"
      P25_PEER: "31000 p25reflector:41000 F"
      YSF_PEER_ENABLED: "${YSF_REFLECTOR:-0}"
      YSF_PEER: "12345 ysfreflector:42000 A"   # your YSF registry id once registered
    ports:
      - 80:80/tcp             # dashboard
      - 8080:8080/tcp         # repnet
      - 8880:8880/udp         # dmr+ dmo
      - 10001:10001/udp       # json interface
      - 10002:10002/udp       # xlx interlink
      - 12345-12346:12345-12346/udp # icom terminal
      - 17000:17000/udp       # m17
      - 20001:20001/udp       # dplus
      - 21110:21110/udp       # yaesu imrs
      - 30001:30001/udp       # dextra
      - 30051:30051/udp       # dcs
      - 40000:40000/udp       # icom terminal dv
      - 42000:42000/udp       # ysf (xlxd's own - the ysfreflector below is another port)
      - 62030:62030/udp       # mmdvm
    volumes:
      - ./config:/config      # xlxd.whitelist / blacklist / interlink / terminal, callinghome.php
      # - ./vnstat:/var/lib/vnstat   # traffic page history (TRAFFIC_PAGE on)
      ## optional dashboard theme - mount single files over the image's dashboard
      # - ./custom/layout.css:/var/www/xlxd/css/layout.css
      # - ./custom/header.jpg:/var/www/xlxd/img/header.jpg

  ## optional NXDN reflector - NXDN radios / hotspots connect here, xlxd peers it onto module E
  nxdnreflector:
    container_name: nxdnreflector
    hostname: nxdnreflector
    image: cbodden/nxdnreflector-docker:latest
    restart: unless-stopped
    scale: ${NXDN_REFLECTOR:-0}
    environment:
      NXDN_TG: "31000"        # required - the reflector's number (1-65535), same as in NXDN_PEER
      NXDN_LOG_FILE: "on"     # log files for nxdndashboard
      TZ: UTC
    volumes:
      - nxdn-logs:/var/log/nxdnreflector
    ports:
      - 41400:41400/udp

  ## optional P25 reflector - P25 radios / hotspots connect here, xlxd peers it onto module F
  p25reflector:
    container_name: p25reflector
    hostname: p25reflector
    image: cbodden/p25reflector-docker:latest
    restart: unless-stopped
    scale: ${P25_REFLECTOR:-0}
    environment:
      P25_LOG_FILE: "on"      # log files for p25dashboard
      TZ: UTC
    volumes:
      - p25-logs:/var/log/p25reflector
    ports:
      - 41000:41000/udp

  ## optional dashboards - follow their reflector's switch unless NXDN_DASHBOARD / P25_DASHBOARD is set
  nxdndashboard:
    container_name: nxdndashboard
    image: cbodden/nxdndashboard-docker:latest
    restart: unless-stopped
    scale: ${NXDN_DASHBOARD:-${NXDN_REFLECTOR:-0}}
    environment:
      DASHBOARD_NAME: NXDN 31000
      DASHBOARD_TAGLINE: XLX000 module E
      # DASHBOARD_PATH: /nxdnreflector/   # when a reverse proxy serves it under a path
      TZ: UTC
    volumes:
      - nxdn-logs:/var/log/nxdnreflector:ro
    ports:
      - 8081:80/tcp

  p25dashboard:
    container_name: p25dashboard
    image: cbodden/p25dashboard-docker:latest
    restart: unless-stopped
    scale: ${P25_DASHBOARD:-${P25_REFLECTOR:-0}}
    environment:
      DASHBOARD_NAME: P25 31000
      DASHBOARD_TAGLINE: XLX000 module F
      # DASHBOARD_PATH: /p25reflector/
      TZ: UTC
    volumes:
      - p25-logs:/var/log/p25reflector:ro
    ports:
      - 8082:80/tcp

  ## optional YSF reflector (pYSFReflector3) - a registered YSF room, xlxd peers it onto module A
  ysfreflector:
    container_name: ysfreflector
    hostname: ysfreflector
    image: cbodden/ysfreflector-docker:latest
    restart: unless-stopped
    scale: ${YSF_REFLECTOR:-0}
    environment:
      YSF_NAME: XLX000-XYZ123   # required - registry name, 16 characters max
      YSF_DESCRIPTION: XLX000 mod A # 14 characters max
      YSF_ID: "0"             # 0 = hashed from YSF_NAME like the registry does; set it only if the registry differs
      TZ: UTC
    volumes:
      - ysf-data:/opt/pysfreflector       # deny list, home db, last DG-ID per gateway
      - ysf-logs:/var/log/ysfreflector    # dated logs + YSFReflector.ini for ysfdashboard2
    ports:
      - 41500:42000/udp       # public port != xlxd's 42000

  ysfdashboard2:
    container_name: ysfdashboard2
    image: cbodden/ysfdashboard2-docker:latest
    restart: unless-stopped
    scale: ${YSF_DASHBOARD:-${YSF_REFLECTOR:-0}}
    environment:
      DASHBOARD_NAME: XLX000-XYZ123
      DASHBOARD_TAGLINE: XLX000 module A
      # DASHBOARD_PATH: /ysfreflector/
      TZ: UTC
    volumes:
      - ysf-logs:/var/log/ysfreflector:ro
    ports:
      - 8083:80/tcp

  ## pYSF3's own dashboard (reads the reflector's json feed) - opt-in
  ysfdashboard:
    container_name: ysfdashboard
    image: cbodden/ysfdashboard-docker:latest
    restart: unless-stopped
    scale: ${YSF_DASHBOARD_CLASSIC:-0}
    environment:
      YSF_JSON_HOST: ysfreflector
      TZ: UTC
    ports:
      - 8084:80/tcp

volumes:
  nxdn-logs:
  p25-logs:
  ysf-data:
  ysf-logs:
